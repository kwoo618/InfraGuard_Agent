global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # target-server 자체 메트릭 (prometheus-fastapi-instrumentator가 /metrics로 노출)
  #
  # scale 대응: Docker 내장 DNS에 "target-server" A 레코드를 조회해
  # --scale로 뜬 replica IP 전부를 개별 타깃으로 디스커버리한다 (5초마다 갱신).
  # instance 라벨은 "컨테이너IP:8080"이 된다.
  # 이전 static_configs("target-server:8080")는 DNS 라운드로빈 때문에 매 scrape가
  # replica 1개만 긁어 스케일 후 sum(...) 쿼리가 과소집계됐다 (docs/02_알려진이슈.md ISSUE-2).
  - job_name: "target-server"
    dns_sd_configs:
      - names: ["target-server"]
        type: A
        port: 8080
        refresh_interval: 5s

  # cAdvisor — 컨테이너 CPU/Mem 메트릭 (Docker 컨테이너 리소스 모니터링용)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Prometheus 자체 모니터링
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
