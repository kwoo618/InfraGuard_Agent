# Grafana 데이터소스 프로비저닝 — docker compose up만으로 Prometheus 데이터소스를 만든다 (docs/02 ISSUE-4).
# dashboard.json의 모든 패널이 uid "prometheus"를 참조하므로 uid를 고정한다.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # prometheus.yml scrape_interval과 맞춘다. 패널 rate 창 $__rate_interval의 최소값(4 x 5s = 20s)이 여기서 정해진다.
      timeInterval: 5s
