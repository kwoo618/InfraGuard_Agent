# Grafana 대시보드 프로비저닝 — docker compose up만으로 dashboard.json을 불러온다 (docs/02 ISSUE-4).
# 저장소 파일이 기준이라 UI에서 고친 내용은 저장하지 않는다.
apiVersion: 1

providers:
  - name: infraguard
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      # docker-compose.yml이 ./infra/grafana를 이 경로에 마운트한다. provider는 .json 파일만 읽는다.
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
