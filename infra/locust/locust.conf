# locust.conf 
# Locust default headless config.
# This file is auto-loaded by Locust whenever it is run with cwd set to this
# directory (run_load_test.py does `subprocess.Popen(..., cwd=LOCUST_DIR)`),
# or when a developer runs `locust` manually from infra/locust/. Any flag
# passed explicitly on the CLI (e.g. --users, --run-time from run_load_test.py)
# overrides the value set here.
#
# Local environment guardrail: users capped at 50 to avoid CPU exhaustion
# (see CLAUDE.md - "Locust load upper bound 50 TPS"). Each virtual user maps
# to roughly 1 TPS given locustfile.py's wait_time. run_load_test.py can
# override --users at runtime.
#
# NOTE: keep this file ASCII-only. Locust's configargparse reads it with the
# OS default locale encoding (e.g. cp949 on Korean Windows), so any non-ASCII
# byte here crashes with UnicodeDecodeError before the run even starts.
# (This was an actual bug found while testing on Windows - see git history.)

# Scenario file to run (relative to this conf file's directory)
locustfile = locustfile.py

# Run without the web UI - required for run_load_test.py's automated runs
headless = true

# Default number of concurrent virtual users (overridden by --users at call time)
users = 50

# How many users to spawn per second until `users` is reached
spawn-rate = 10

# Default test duration when not overridden by --run-time
run-time = 30s

# Default target - matches docker-compose.yml's target-server port mapping
host = http://localhost:8080

# Write aggregated stats to result_stats.csv / result_failures.csv etc.
# run_load_test.py overrides this per-call with a temp-dir prefix so
# concurrent runs never clobber each other's output.
csv = result

# Print summary stats only, not per-request logs (keeps stdout readable)
only-summary = true
