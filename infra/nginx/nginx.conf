# nginx — target-server replica 앞단 로드밸런서 (docs/03 Phase 2, ISSUE-1 / ISSUE-9)
#
# 부하 경로: Locust → localhost:8080(호스트) / nginx:8080(컨테이너 네트워크) → target-server replica들
# target-server는 호스트 포트를 받지 않는다. 스케일로 컨테이너가 재생성돼도
# 부하 대상 포트(8080)는 nginx가 고정으로 잡고 있으므로 사라지지 않는다 (ISSUE-9).
#
# 스케일 반영: upstream의 `server ... resolve`(오픈소스 nginx 1.27.3+)로
# Docker 내장 DNS(127.0.0.11)의 "target-server" A 레코드를 주기적으로 다시 조회한다.
# --scale로 늘거나 줄어든 replica가 nginx 재시작/reload 없이 풀에 반영된다.
#   - valid=2s 필수: Docker 내장 DNS의 TTL은 600초라서 생략하면 최대 10분간 반영되지 않는다.
#   - "스케일 후 nginx reload" 방식은 scale_service가 nginx에 결합되고,
#     수동 --scale(검증·e2e) 뒤 reload를 빠뜨릴 위험이 있어 쓰지 않았다.
#
# Prometheus는 nginx를 거치지 않고 replica를 직접 수집한다 (prometheus.yml dns_sd_configs).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream target_server {
        # resolve는 server group이 shared memory(zone)에 있어야 동작한다.
        zone target_server 64k;
        resolver 127.0.0.11 valid=2s ipv6=off;
        resolver_timeout 2s;

        # 기본 라운드로빈. fail_timeout을 기본값(10s)보다 짧게 둬서,
        # 기동 중에 한 번 연결을 거절한 새 replica가 10초씩 풀에서 빠지지 않게 한다.
        server target-server:8080 resolve max_fails=1 fail_timeout=2s;

        keepalive 32;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://target_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # scale-down으로 사라진 replica IP에 오래 붙잡히지 않게 짧게 둔다.
            proxy_connect_timeout 2s;
            # 연결 실패/타임아웃만 다른 replica로 재시도한다.
            # http_500은 넣지 않는다: /flaky의 500을 재시도로 숨기면 error_rate 측정이 왜곡된다.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
        }
    }
}
