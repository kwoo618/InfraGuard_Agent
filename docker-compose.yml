services:
  target-server:
    build:
      context: ./infra/target-server
    # container_name 제거 — --scale 동작을 위해 필수
    # container_name이 있으면 Docker가 복제를 거부함
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: infraguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - target-server

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infraguard-cadvisor
    ports:
      # target-server가 --scale 시 호스트 포트 8080-8089를 사용하므로
      # cAdvisor는 그 범위 밖(8090)으로 옮겨 충돌을 피한다.
      # (기존 8081은 scale된 target-server replica와 겹쳐 8082로 밀리는 문제 발생)
      - "8090:8080"
    volumes:
      # 윈도우 Docker Desktop 호환 경로
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - //sys:/sys:ro
      - //var/lib/docker/:/var/lib/docker:ro
    privileged: true

  grafana:
    image: grafana/grafana:latest
    container_name: infraguard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

networks:
  default:
    name: infraguard-network