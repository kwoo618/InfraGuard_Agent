services:
  target-server:
    build:
      context: ./infra/target-server
    # container_name 제거 — --scale 동작을 위해 필수
    # container_name이 있으면 Docker가 복제를 거부함
    # 호스트 포트를 받지 않는다. 호스트 노출은 nginx(localhost:8080)가 담당하고
    # nginx가 replica들로 요청을 분산한다 (ISSUE-1). 예전 범위 매핑("8080-8089:8080")은
    # 재생성 시 8080이 비어 부하 대상이 사라지는 문제가 있었다 (ISSUE-9).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 3

  # target-server replica 앞단 로드밸런서. 부하(Locust)는 localhost:8080 → nginx → replica로 간다.
  # 스케일 후 새 replica 반영 방식은 infra/nginx/nginx.conf 주석 참고.
  nginx:
    image: nginx:1.28-alpine   # upstream `server ... resolve`는 오픈소스 1.27.3+ 필요
    container_name: infraguard-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - target-server

  prometheus:
    image: prom/prometheus:latest
    container_name: infraguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - target-server

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infraguard-cadvisor
    ports:
      # cAdvisor 웹 UI는 호스트 8090 (8080은 nginx가 사용).
      # 예전에 target-server 범위 포트(8080-8089)를 피하려고 옮긴 값을 그대로 유지한다.
      - "8090:8080"
    volumes:
      # 윈도우 Docker Desktop 호환 경로
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - //sys:/sys:ro
      - //var/lib/docker/:/var/lib/docker:ro
    privileged: true

  grafana:
    # latest 금지 — 2026-09-12 로컬에서 동작을 확인한 버전으로 고정 (#74)
    image: grafana/grafana:13.1.0
    container_name: infraguard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # 로그인 없이 보기 전용(Viewer)으로 연다. 관리자(admin)는 /login으로 들어간다.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # 결과 패널의 Grafana 링크(http://localhost:3000)가 홈 화면으로 이 대시보드를 바로 연다.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/dashboard.json
    volumes:
      - ./infra/grafana:/var/lib/grafana/dashboards:ro
      # 데이터소스(uid "prometheus")·대시보드 자동 로드 (docs/02 ISSUE-4).
      # 이미지 기본 provisioning 디렉터리 전체를 덮지 않도록 하위 디렉터리만 마운트한다.
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  # FastAPI 백엔드(+SSE UI). "app" 프로필에서만 뜬다.
  #   docker compose up -d                     → 인프라만 (백엔드는 호스트에서 uvicorn으로)
  #   docker compose --profile app up -d --build → 전체 스택 한 방 (localhost:8000)
  # 백엔드가 부하 테스트(locust)·스케일링(docker compose)을 subprocess로 실행하므로
  # 호스트 docker 소켓과 repo 루트(compose 파일 포함)를 마운트한다.
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 네트워크에서는 localhost가 아니라 서비스 이름으로 접근한다.
      - PROMETHEUS_URL=http://prometheus:9090
      # 부하는 nginx(LB)를 거쳐 replica로 분산된다. 호스트 실행(localhost:8080)과 같은 경로.
      - TARGET_SERVER_URL=http://nginx:8080
      # scale_service의 docker compose가 호스트의 기존 프로젝트를 조종하도록 이름 고정.
      - COMPOSE_PROJECT_NAME=infraguard_agent
    volumes:
      - ./:/app                                   # repo 루트(코드 + docker-compose.yml)
      - //var/run/docker.sock:/var/run/docker.sock  # docker-out-of-docker
    depends_on:
      - prometheus
      - target-server
      - nginx

networks:
  default:
    name: infraguard-network