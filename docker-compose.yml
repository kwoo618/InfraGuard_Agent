services:
  target-server:
    build:
      context: ./infra/target-server
    # container_name 제거 — --scale 동작을 위해 필수
    # container_name이 있으면 Docker가 복제를 거부함
    ports:
      - "8080-8089:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: infraguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - target-server

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infraguard-cadvisor
    ports:
      # target-server가 --scale 시 호스트 포트 8080-8089를 사용하므로
      # cAdvisor는 그 범위 밖(8090)으로 옮겨 충돌을 피한다.
      # (기존 8081은 scale된 target-server replica와 겹쳐 8082로 밀리는 문제 발생)
      - "8090:8080"
    volumes:
      # 윈도우 Docker Desktop 호환 경로
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - //sys:/sys:ro
      - //var/lib/docker/:/var/lib/docker:ro
    privileged: true

  grafana:
    image: grafana/grafana:latest
    container_name: infraguard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # FastAPI 백엔드(+SSE UI). "app" 프로필에서만 뜬다.
  #   docker compose up -d                     → 인프라만 (백엔드는 호스트에서 uvicorn으로)
  #   docker compose --profile app up -d --build → 전체 스택 한 방 (localhost:8000)
  # 백엔드가 부하 테스트(locust)·스케일링(docker compose)을 subprocess로 실행하므로
  # 호스트 docker 소켓과 repo 루트(compose 파일 포함)를 마운트한다.
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 네트워크에서는 localhost가 아니라 서비스 이름으로 접근한다.
      - PROMETHEUS_URL=http://prometheus:9090
      - TARGET_SERVER_URL=http://target-server:8080
      # scale_service의 docker compose가 호스트의 기존 프로젝트를 조종하도록 이름 고정.
      - COMPOSE_PROJECT_NAME=infraguard_agent
    volumes:
      - ./:/app                                   # repo 루트(코드 + docker-compose.yml)
      - //var/run/docker.sock:/var/run/docker.sock  # docker-out-of-docker
    depends_on:
      - prometheus
      - target-server

networks:
  default:
    name: infraguard-network