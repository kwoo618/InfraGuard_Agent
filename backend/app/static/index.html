<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraGuard Agent Dashboard</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

    <div class="container">

        <h1>🛡️ InfraGuard Agent 제어 대시보드</h1>
        <p>인프라 자율 진단 및 스케일링 에이전트 시스템</p>

        <div class="status-panel">
            <span>Agent Status</span>
            <div class="status-right">
                <span id="debug-badge" class="debug-badge hidden" title="URL에 ?debug=1이 있어 force_scaling=true를 요청합니다">DEBUG · force_scaling 요청</span>
                <span id="agent-status" class="status ready">
                    🟢 READY
                </span>
            </div>
        </div>

        <div class="progress-timeline">

            <div id="step-load" class="timeline-step">
                <div class="timeline-circle">⚡</div>
                <span>Load Test</span>
            </div>

            <div class="timeline-line"></div>

            <div id="step-metric" class="timeline-step">
                <div class="timeline-circle">📊</div>
                <span>Metrics</span>
            </div>

            <div class="timeline-line"></div>

            <div id="step-ai" class="timeline-step">
                <div class="timeline-circle">🧠</div>
                <span>AI Analysis</span>
            </div>

            <div class="timeline-line"></div>

            <div id="step-plan" class="timeline-step">
                <div class="timeline-circle">📋</div>
                <span>Plan</span>
            </div>

            <div class="timeline-line"></div>

            <div id="step-approval" class="timeline-step">
                <div class="timeline-circle">⚠️</div>
                <span>Approval</span>
            </div>

            <div class="timeline-line"></div>

            <div id="step-scale" class="timeline-step">
                <div class="timeline-circle">🚀</div>
                <span>Scale-Out</span>
            </div>

            <div class="timeline-line"></div>

            <div id="step-report" class="timeline-step">
                <div class="timeline-circle">📄</div>
                <span>Report</span>
            </div>

        </div>



        <div class="control-panel">

            <div class="input-group">
                <label for="target-tps-input">동시 가상 사용자 수 <span class="input-hint">(Locust 동시 접속 사용자 · 처리량 목표 아님)</span></label>
                <input type="number" id="target-tps-input" value="30" min="1">
            </div>

            <div class="input-group">
                <label for="duration-input">테스트 시간(초)</label>
                <input type="number" id="duration-input" value="10" min="1">
            </div>

            <button id="start-btn">
                자율 진단 및 부하 테스트 시작
            </button>
        </div>


        <div id="load-test-progress-container" class="progress-container hidden">
            <div class="progress-bar-header">
                <span id="progress-label">⚡ 부하 테스트 진행 중...</span>
                <span id="progress-text">0.0s / 0s (0%)</span>
            </div>
            <div class="progress-bar-track">
                <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
        </div>

    
        <div class="log-container">

            <h3 class="terminal-title">
                🤖 에이전트 실시간 분석 로그 (SSE)
            </h3>

            <div id="log-window" class="log-window">
                <div class="log-entry system">
                    시스템 대기 중...
                </div>
            </div>

        </div>

        
        <div id="approval-modal" class="hidden">

            <h3>⚠️ 인프라 조치 승인 요청</h3>

            <p id="modal-message"></p>

            <div class="modal-buttons">

                <button id="approve-btn">
                    승인 (Scale-out)
                </button>

                <button id="reject-btn">
                    거절
                </button>

            </div>

        </div>

    </div>

    <script src="main.js?v=4"></script>

</body>

</html>
